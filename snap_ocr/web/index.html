<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR 截图翻译</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>

  <main class="container">
    <header class="hero">
      <div class="logo">文</div>
      <h1>OCR 截图翻译</h1>
      <p class="subtitle">粘贴截图 → 识字 → 复制原文或中英对照</p>
    </header>

    <div id="banner" class="banner hidden"></div>

    <section class="card">
      <div class="toolbar">
        <label class="field">
          <span>翻译方向</span>
          <select id="direction">
            <option value="auto">自动（中↔英）</option>
            <option value="zh2en">中文 → 英文</option>
            <option value="en2zh">英文 → 中文</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="auto-translate" checked />
          识别后自动翻译
        </label>
        <div class="toolbar-actions">
          <button id="paste-btn" class="btn btn-ghost">从剪贴板粘贴</button>
          <label class="btn btn-ghost file-btn">
            上传图片
            <input id="file-input" type="file" accept="image/*" hidden />
          </label>
          <button id="clear-btn" class="btn btn-ghost">清空</button>
        </div>
      </div>

      <div id="dropzone" class="dropzone" tabindex="0">
        <div id="placeholder" class="placeholder">
          <p class="big">在此按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴截图</p>
          <p class="dim">也可拖拽图片到这里，或点击上方「上传图片」</p>
        </div>
        <img id="preview" class="preview hidden" alt="截图预览" />
      </div>
    </section>

    <section id="loading" class="card loading hidden">
      <div class="spinner"></div>
      <p id="loading-text">正在识别…</p>
    </section>

    <section id="result" class="result-grid hidden">
      <div class="card result-card">
        <div class="result-head">
          <h2>识别原文</h2>
          <div class="result-actions">
            <span id="ocr-meta" class="meta"></span>
            <button id="copy-ocr" class="btn btn-primary btn-sm">复制原文</button>
          </div>
        </div>
        <textarea id="ocr-text" class="result-text" rows="12" placeholder="识别结果会显示在这里"></textarea>
        <div class="result-foot">
          <button id="translate-btn" class="btn btn-ghost btn-sm">重新翻译</button>
        </div>
      </div>

      <div class="card result-card">
        <div class="result-head">
          <h2>译文 / 对照</h2>
          <div class="result-actions">
            <span id="tr-meta" class="meta"></span>
            <button id="copy-tr" class="btn btn-ghost btn-sm">复制译文</button>
            <button id="copy-bi" class="btn btn-primary btn-sm">复制对照</button>
          </div>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="translated">译文</button>
          <button class="tab" data-tab="bilingual">中英对照</button>
        </div>
        <textarea id="tr-text" class="result-text" rows="12" placeholder="译文会显示在这里（需网络）"></textarea>
      </div>
    </section>

    <footer class="footer">
      本地 OCR · 翻译走在线接口 · <a href="/api/docs" target="_blank">API 文档</a>
    </footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
